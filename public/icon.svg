    <!-- Inner Lens Ring -->
    <circle cx="150" cy="140" r="50" fill="#FF7893" />
    <!-- Heart Symbol -->
    <path d="M 150 156 C 150 156 128 140 128 126 C 128 116 136 110 144 110 C 149 110 150 114 150 114 C 150 114 151 110 156 110 C 164 110 172 116 172 126 C 172 140 150 156 150 156 Z" fill="#FFFFFF" />
